server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Adjuntos (hasta 10 MB) e importación del Excel de iglesias (hasta 5 MB).
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://fundtrack-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Los reportes grandes (un año entero en PDF) pueden tardar más que el minuto por defecto.
        proxy_read_timeout 300s;
    }

    # index.html referencia los nombres de archivo con hash de cada build (ej. main.a1b2c3.js);
    # si el navegador la cachea, después de un deploy sigue pidiendo archivos viejos que ya no
    # existen y la app queda rota hasta que el usuario limpia caché a mano.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Los i18n/*.json no llevan hash de build: sin esto, después de un deploy con textos nuevos
    # el navegador sigue mostrando las traducciones viejas (o claves crudas) hasta limpiar caché.
    location /i18n/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
